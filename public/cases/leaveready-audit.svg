7" y="319" font-family="Arial,sans-serif" font-size="21" font-weight="800" fill="#5935be">✦ AI journey suggestion</text><text x="110" y="403" font-family="Arial,sans-serif" font-weight="800" font-size="37" fill="#1e172e">Leave at 08:12</text><text x="772" y="403" font-family="Arial,sans-serif" font-weight="800" font-size="37" fill="#1e172e">Leave at 08:12</text><text x="112" y="449" font-family="Arial,sans-serif" font-size="25" fill="#5d5268">Bus 24 · Arrival 08:42</text><text x="774" y="449" font-family="Arial,sans-serif" font-size="25" fill="#5d5268">Bus 24 · Arrival 08:52</text><rect x="109" y="473" width="206" height="40" rx="20" fill="#ffe4df"/><text x="132" y="500" font-family="Arial,sans-serif" font-weight="800" font-size="18" fill="#9a4143">“Recommended”</text><rect x="772" y="473" width="223" height="40" rx="20" fill="#e5dcff"/><text x="800" y="500" font-family="Arial,sans-serif" font-weight="800" font-size="18" fill="#532dc6">Estimated arrival</text><text x="110" y="558" font-family="Arial,sans-serif" font-size="22" fill="#aa4854">✕ Arrival changed without justification</text><text x="110" y="597" font-family="Arial,sans-serif" font-size="22" fill="#aa4854">✕ Source and uncertainty dropped</text><text x="772" y="557" font-family="Arial,sans-serif" font-size="21" fill="#4c3a7d">Based on saved 09:00 goal, walking limit,</text><text x="772" y="586" font-family="Arial,sans-serif" font-size="21" fill="#4c3a7d">departure buffer and example transit feed.</text><text x="772" y="627" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#297a54">✓ “Arrival is an estimate.”</text><text x="67" y="723" font-family="Arial,sans-serif" font-size="17" fill="#635b70">Readable reconstruction of documented design deviations and corrections · illustrative journey data</text></svg>