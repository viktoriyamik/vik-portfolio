<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HaeSiivooja · Booking journey</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1fa;color:#292338;font:15px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #2a784c;outline-offset:3px}.app{max-width:430px;margin:auto;padding:22px 22px 30px;min-height:760px}.brand{display:flex;justify-content:space-between;align-items:center;font-weight:750;font-size:20px}.brand span{color:#7456a5;font-size:26px}.notice{font-size:11px;line-height:1.6;color:#696173;margin:12px 0 18px}.roles{display:flex;padding:4px;background:#e5ddf0;border-radius:12px;gap:4px}.roles button{flex:1;padding:10px;border:0;border-radius:8px;background:transparent;color:#51445f;font-size:12px}.roles button[aria-pressed=true]{background:white;color:#3c285d;box-shadow:0 2px 6px #35254b12}h1{font-size:25px;line-height:1.2;letter-spacing:-.7px;margin:22px 0 8px}p{line-height:1.6;color:#6b6277;font-size:13px}.progress{display:flex;gap:5px;margin-top:18px}.progress i{height:4px;flex:1;background:#ded5ea;border-radius:4px}.progress i.on{background:#7957ad}.step{font-size:10px;letter-spacing:1px;margin-top:14px;color:#715c8d}.choices{display:grid;gap:9px;margin:18px 0}.choice{border:1px solid #ddd3e9;border-radius:12px;background:#fff;text-align:left;padding:14px;width:100%;color:#30243f}.choice[aria-pressed=true]{border:2px solid #7d5aac;padding:13px;background:#eee6fa}.choice b{display:block;font-size:14px}.choice small{display:block;margin-top:5px;color:#6b607a;font-size:12px;line-height:1.5}.label{display:block;font-size:12px;font-weight:650;margin:20px 0 12px}.extra{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #ddd3e9;border-radius:10px;padding:12px;font-size:12px;margin-bottom:8px}.extra input{accent-color:#7957ad;width:18px;height:18px}.primary,.secondary{width:100%;border:0;border-radius:11px;padding:14px;font-weight:650;margin-top:12px}.primary{background:#7957ad;color:#fff}.secondary{background:#e6deef;color:#513d6d}.actions{margin-top:22px}.summary{background:white;padding:18px;border-radius:14px;border:1px solid #ddd3e9;margin-top:20px}.summary dl{margin:0}.summary dt{font-size:10px;color:#72627f;text-transform:uppercase;letter-spacing:.6px;margin-top:14px}.summary dt:first-child{margin:0}.summary dd{margin:5px 0 0;font-size:14px;font-weight:600}.badge{display:inline-block;background:#f6ead2;color:#745215;border-radius:30px;padding:6px 10px;font-size:11px;font-weight:700}.badge.done{background:#dcefe4;color:#216344}.success{font-size:40px;color:#386f51;margin-top:26px}.foot{font-size:10px;text-align:center;margin-top:22px;color:#756b7e}.empty{background:#fff;padding:22px;border-radius:14px;margin-top:22px}.inline{display:flex;gap:8px}.inline .choice{text-align:center}.status-message{font-size:12px;min-height:20px;margin-top:12px}
</style></head><body><main class="app"><header class="brand">HaeSiivooja <span aria-hidden="true">✳</span></header><p class="notice">Choose the service, review the request and follow the booking journey from both sides.</p><nav class="roles" aria-label="Choose customer or cleaner view"><button id="customer" aria-pressed="true">Customer</button><button id="cleaner" aria-pressed="false">Cleaner</button></nav><div id="screen"></div><p id="announcement" class="status-message" role="status" aria-live="polite"></p><p class="foot">Designed by Viktoriya Mikhaylova</p></main><script>
const state={role:'customer',step:0,service:'Standard cleaning',extras:[],cleaner:'Cleaner A',time:'Day 1 · 10:00',sent:false,confirmed:false};
const services=[['Standard cleaning','Routine cleaning for a maintained home.'],['Deep cleaning','A more thorough clean for areas needing extra attention.'],['Move-out cleaning','Preparing an empty home for its next resident.'],['Window cleaning','A focused request for windows.']];
const slots=['Day 1 · 10:00','Day 1 · 14:00','Day 2 · 10:00'];
const screen=document.getElementById('screen');
function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function add(tag,text,cls){const e=el(tag,text,cls);screen.append(e);return e}
function button(parent,text,cls,action){const b=el('button',text,cls);b.type='button';b.onclick=action;parent.append(b);return b}
function announce(t){document.getElementById('announcement').textContent=t}
function choice(parent,label,detail,selected,action){const b=button(parent,'','choice',action);b.setAttribute('aria-pressed',String(selected));b.append(el('b',label));if(detail)b.append(el('small',detail));return b}
function summary(){const box=add('div','','summary');const dl=el('dl');box.append(dl);const price=state.service==='Standard cleaning'?105:state.service==='Deep cleaning'?150:state.service==='Move-out cleaning'?180:70;const rows=[['Service',state.service],['Extras',state.extras.length?state.extras.join(', '):'No extras'],['Cleaner',state.cleaner],['Requested time',state.time],['Estimated price','€'+(price+state.extras.length*15)+'']];rows.forEach(([k,v])=>dl.append(el('dt',k),el('dd',v)));return box}
function render(){screen.replaceChildren();document.getElementById('customer').setAttribute('aria-pressed',String(state.role==='customer'));document.getElementById('cleaner').setAttribute('aria-pressed',String(state.role==='cleaner'));
if(state.role==='cleaner'){add('h1','Your booking requests');add('p','Understand the request before accepting the work.');if(!state.sent){const box=add('div','','empty');box.append(el('b','No requests yet'),el('p','Switch to Customer and complete a request first.'));button(box,'Try the customer journey','secondary',()=>{state.role='customer';render()});return}add('span',state.confirmed?'Confirmed':'Awaiting your response','badge'+(state.confirmed?' done':''));summary();add('p',state.confirmed?'The customer now sees this appointment as confirmed.':'Accepting this request confirms the appointment for both sides.');if(!state.confirmed)button(screen,'Accept request','primary',()=>{state.confirmed=true;announce('Request accepted. The customer booking is now confirmed.');render()});button(screen,'View customer booking','secondary',()=>{state.role='customer';render()});return}
if(state.sent){add('div','✓','success');add('h1',state.confirmed?'Your clean is confirmed':'Request sent');add('span',state.confirmed?'Confirmed':'Waiting for cleaner confirmation','badge'+(state.confirmed?' done':''));add('p',state.confirmed?'Both sides now share the same appointment details.':'This is a request, not a confirmed appointment. Try the Cleaner view to accept it.');summary();button(screen,'Switch to cleaner view','primary',()=>{state.role='cleaner';render()});button(screen,'Start again','secondary',()=>{state.step=0;state.sent=false;state.confirmed=false;state.extras=[];announce('Starting again.');render()});return}
const bar=add('div','','progress');for(let i=0;i<4;i++)bar.append(el('i','',i<=state.step?'on':''));add('div','STEP '+(state.step+1)+' OF 4','step');
if(state.step===0){add('h1','What kind of clean?');add('p','Start with the service that matches your task.');const box=add('div','','choices');services.forEach(([name,desc])=>choice(box,name,desc,state.service===name,()=>{state.service=name;render()}));}
if(state.step===1){add('h1','Make it fit your home');add('p','Add only what you need. Review the full scope before submitting.');add('span','Optional extras · €15 each','label');['Balcony cleaning','Bed linen change'].forEach(name=>{const label=add('label','','extra');const check=el('input');check.type='checkbox';check.checked=state.extras.includes(name);check.onchange=()=>{state.extras=check.checked?[...state.extras,name]:state.extras.filter(x=>x!==name);announce(name+(check.checked?' added.':' removed.'))};label.append(check,el('span',name))});}
if(state.step===2){add('h1','Choose a cleaner & time');add('p','Providers and request slots for this walkthrough.');const box=add('div','','choices');['Cleaner A','Cleaner B'].forEach(name=>choice(box,name,'Provider · Helsinki',state.cleaner===name,()=>{state.cleaner=name;render()}));add('span','Request a time','label');const times=add('div','','choices');slots.forEach(time=>choice(times,time,'Available time',state.time===time,()=>{state.time=time;render()}));}
if(state.step===3){add('h1','Review your request');add('p','Check the scope and requested time. The cleaner will still need to confirm.');summary();}
const actions=add('div','','actions');button(actions,state.step===3?'Send request':'Continue','primary',()=>{if(state.step===3){state.sent=true;announce('Request sent. Awaiting cleaner confirmation.')}else{state.step++;announce('Step '+(state.step+1)+' of 4.')}render()});if(state.step>0)button(actions,'Back','secondary',()=>{state.step--;render()});}
document.getElementById('customer').onclick=()=>{state.role='customer';render();announce('Customer view.')};document.getElementById('cleaner').onclick=()=>{state.role='cleaner';render();announce('Cleaner view.')};render();
</script></body></html>
